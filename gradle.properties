# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# Allow Gradle to use up to 1 GB of RAM
org.gradle.jvmargs=-Xmx1024M

android.nonTransitiveRClass=false

# ============================================================
# Publishing configuration for instantauto module (Maven Central via Central Portal)
# ============================================================

# GPG Signing configuration (required for Maven Central)
# Generate GPG key: gpg --gen-key
# List keys: gpg --list-secret-keys --keyid-format=long
# Export secret key: gpg --export-secret-keys YOUR_KEY_ID > secring.gpg
# Publish public key: gpg --keyserver keyserver.ubuntu.com --send-keys YOUR_KEY_ID
# Set via environment variables (RECOMMENDED - don't commit secrets):
#   export GPG_KEY_ID="your-key-id"
#   export GPG_PASSPHRASE="your-passphrase"
#   export GPG_SECRET_KEY_RING_FILE="/path/to/secring.gpg"
# signing.keyId=YOUR_GPG_KEY_ID
# signing.password=YOUR_GPG_PASSPHRASE
# signing.secretKeyRingFile=/path/to/secring.gpg

# Central Portal Publishing (replaces deprecated Sonatype OSSRH)
# Generate token at: https://central.sonatype.com/account
# Create "Publisher Token" - save it securely (shown only once!)
# Set via environment variables (RECOMMENDED - don't commit secrets):
#   export CENTRAL_PORTAL_USERNAME="your-username"
#   export CENTRAL_PORTAL_TOKEN="your-publisher-token"
# centralPortalUsername=YOUR_USERNAME
# centralPortalToken=YOUR_TOKEN