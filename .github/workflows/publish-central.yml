name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1)'
        required: true
        type: string

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Export GPG secret key for Gradle
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --export-secret-keys ${{ secrets.GPG_KEY_ID }} > ${{ runner.temp }}/secring.gpg

      - name: Configure Gradle properties
        run: |
          cat >> gradle.properties << EOF
          signing.keyId=${{ secrets.GPG_KEY_ID }}
          signing.password=${{ secrets.GPG_PASSPHRASE }}
          signing.secretKeyRingFile=${{ runner.temp }}/secring.gpg
          centralPortalUsername=${{ secrets.CENTRAL_PORTAL_USERNAME }}
          centralPortalToken=${{ secrets.CENTRAL_PORTAL_TOKEN }}
          EOF

      - name: Update version if workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i "s/version = '.*'/version = '${{ github.event.inputs.version }}'/" instantauto/build.gradle

      - name: Publish to Maven Central
        run: ./gradlew :instantauto:publishMavenJavaPublicationToCentralPortal --no-configuration-cache
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_SECRET_KEY_RING_FILE: ${{ runner.temp }}/secring.gpg

      - name: Verify publication
        run: |
          echo "Publication completed. Check https://central.sonatype.com for status"
          echo "Search at https://search.maven.org after ~30 minutes"

      - name: Upload staging repository to Central Portal
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer $(printf '%s:%s' \
              "${CENTRAL_PORTAL_USERNAME}" \
              "${CENTRAL_PORTAL_TOKEN}" | base64 -w 0)" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.bosco-maker?publishing_type=automatic"
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}

      - name: Verify publication
        run: |
          echo "Deployment submitted to Maven Central."
          echo "Check https://central.sonatype.com/publishing"

      - name: Test signing
        run: ./gradlew :instantauto:signMavenJavaPublication
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}